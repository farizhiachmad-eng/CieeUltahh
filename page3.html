<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu, Sayangku ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffadd2, #ff8fbd, #ffc1df);
    min-height: 100vh;
    color: #a82e68;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 35px 20px 25px;
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 30px;
    background: rgba(255,255,255,.45);
    color: #a34370;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

h1 {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.4;
}

.script {
    font-family: 'Dancing Script', cursive;
    font-size: 43px;
    color: #d63384;
    margin-bottom: 28px;
}

.video-box {
    width: 100%;
    padding: 12px;
    border-radius: 28px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 12px 35px rgba(180,50,105,.15);
}

.video-frame {
    width: 100%;
    height: 520px;
    border: none;
    border-radius: 18px;
    background: white;
    display: block;
}

.caption {
    margin: 25px 0;
    color: #9f3e6b;
    font-size: 14px;
    line-height: 1.9;
}

.caption strong {
    color: #a82e68;
}

.btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 35px;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-top: 14px;
    border: none;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
}

.back {
    color: #a82e68;
    background: rgba(255,255,255,.85);
}

.next {
    color: white;
    background: linear-gradient(90deg, #f83d8b, #e91e73);
    box-shadow: 0 8px 20px rgba(220,30,110,.2);
}

.footer {
    margin-top: 25px;
    font-size: 11px;
    color: #a34c73;
}

.heart {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    animation: floatUp 7s linear infinite;
    opacity: .5;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: .6;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="badge">
        A LITTLE SURPRISE FOR YOU 💌
    </div>

    <h1>Untuk Kamu,</h1>
    <div class="script">Sayangku ❤️</div>

    <div class="video-box">
        <iframe
            class="video-frame"
            src="https://drive.google.com/file/d/1HOdf5KBF8kGFPDtNHyFv-nrL0IJE6lzQ/preview"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

    <div class="caption">
        Ada sesuatu yang ingin aku sampaikan<br>
        khusus untuk kamu, sayanggg 🥹💖<br>
        <strong>Selamat menonton, cintakuuu! ❤️</strong>
    </div>

    <button class="btn back" onclick="history.back()">
        KEMBALI ◀
    </button>

    <button class="btn next" onclick="window.location.href='page4.html'">
        LANJUT KE KEJUTAN BERIKUTNYA 🎁
    </button>

    <div class="footer">
        Made with love, just for you ♡
    </div>

</div>

<script>
function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = ['❤️', '💕', '💗', '💖'][Math.floor(Math.random() * 4)];

    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (12 + Math.random() * 15) + 'px';
    heart.style.animationDuration = (5 + Math.random() * 5) + 's';

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 10000);
}

setInterval(createHeart, 800);
</script>

</body>
</html>
